services:
    postgres:
        image: postgres:17
        container_name: kaizen-postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: kaizen
            POSTGRES_USER: kaizen
            POSTGRES_PASSWORD: kaizen
        ports:
            # Host port 5440 avoids clashing with locally installed Postgres servers (WSL 5432, Windows 5432/5433).
            # Override with POSTGRES_PORT and keep the port in DATABASE_URL in sync.
            - '${POSTGRES_PORT:-5440}:5432'
        volumes:
            - postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U kaizen -d kaizen']
            interval: 5s
            timeout: 5s
            retries: 10

    # Development inbox: every email sent with MAIL_DRIVER=smtp lands here (nothing reaches real
    # inboxes). Web UI http://localhost:8025, SMTP localhost:1025, no login.
    mailpit:
        image: axllent/mailpit:latest
        container_name: kaizen-mailpit
        restart: unless-stopped
        ports:
            - '${MAILPIT_SMTP_PORT:-1025}:1025'
            - '${MAILPIT_UI_PORT:-8025}:8025'

volumes:
    postgres-data:
